name: Deploy Memos Worker

on:
  push:
    branches:
      - main  # 如果你的默认分支是 master，请修改为 master
  workflow_dispatch: # 允许在 GitHub 网页界面手动点击运行

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 安装 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 安装 pnpm (使用官方 action，更稳定)
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 4. 构建前端静态资源
      - name: Build Frontend
        run: |
          cd frontend
          pnpm install
          pnpm build

      # 5. 部署 Backend Worker 到 Cloudflare
      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'backend'
          secrets: |
            JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
