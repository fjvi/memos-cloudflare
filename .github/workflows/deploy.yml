name: Deploy Memos-Cloudflare to Cloudflare Workers

on:
  push:
    branches:
      - main     # 如果你的默认分支是 master，请修改为 master

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json  # 准确指定后端锁文件的路径

      # 1. 启用 Corepack 并使用 pnpm 构建前端
      - name: Build Frontend
        run: |
          cd frontend
          corepack enable
          pnpm install
          pnpm build

      # 2. 进入后端目录安装依赖并部署
      - name: Install Backend Dependencies & Deploy
        run: |
          cd backend
          npm install
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
