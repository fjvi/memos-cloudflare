name = "memos-api"
main = "src/index.ts"
compatibility_date = "2024-06-01"
routes = [
  { pattern = "https://memos-api.mgt.xx.kg/*", custom_domain = true }
]
compatibility_flags = ["nodejs_compat"]

[vars]
LOG_LEVEL = "info"
BASE_URL = "https://memos-api.mgt.xx.kg" # 👈 填入你给Worker绑定的域名，末尾别加斜杠
JWT_SECRET = "MemosSecureTokenSecretKeyStringToFixHmacError2026" # 👈 必须加在这里！长度务必超过32个字符


# Secrets - set via wrangler secret put
# JWT_SECRET
# ALLOWED_ORIGINS  
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY

# 单 Worker 同源部署：Worker 同时托管前端静态资源与 API

[[d1_databases]]
binding = "DB"
database_name = "memos-db"
database_id = "8d43a949-4075-4e91-84f8-335cae26080c"

[env.staging]
name = "memos-cloudflare-staging"

[env.production]
name = "memos-cloudflare-production" 
