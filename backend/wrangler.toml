name = "memos-api"
main = "src/index.ts"
compatibility_date = "2024-06-01"
routes = [
  { pattern = "memos-api.mgt.xx.kg", custom_domain = true }
]
compatibility_flags = ["nodejs_compat"]

[vars]
LOG_LEVEL = "info"
BASE_URL = "https://mmos.pages.dev"
ALLOWED_ORIGINS = "https://mmos.pages.dev"


# Secrets - set via wrangler secret put
# JWT_SECRET
# ALLOWED_ORIGINS  
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY

# 单 Worker 同源部署：Worker 同时托管前端静态资源与 API

[[d1_databases]]
binding = "DB"
database_name = "memos-db"
database_id = "8518611e-c1a1-401f-9fcb-00d544ee549f"

[env.staging]
name = "memos-cloudflare-staging"

[env.production]
name = "memos-cloudflare-production" 
